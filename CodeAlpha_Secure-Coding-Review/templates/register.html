<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Secure Coding Review</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="card"><p class="eyebrow">SECURE CODING REVIEW</p><h1>Create account</h1><p class="muted">Choose a username and a strong password.</p>
{% for category, message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><small>Use at least 12 characters.</small><button type="submit">Register</button></form><p class="footer">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></main></body></html>
