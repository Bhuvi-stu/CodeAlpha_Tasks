<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Secure Coding Review</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="card"><p class="eyebrow">SECURE CODING REVIEW</p><h1>Welcome back</h1><p class="muted">Sign in to your local account.</p>
{% for category, message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" required maxlength="30" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"><button type="submit">Sign in</button></form><p class="footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p></main></body></html>
